name: Build APK

# لا يعمل تلقائيًا عند أي push. التشغيل يدوي فقط من تبويب Actions.
# - debug: بدون أي أسرار، ملف APK للتجربة كـ Artifact فقط.
# - release: يحتاج Secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) ولا يُنشر على GitHub Releases إلا لو اخترت publish.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "نوع البناء"
        type: choice
        options: [debug, release]
        default: debug
      publish:
        description: "نشر ملف release على GitHub Releases (للـ release فقط)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Prepare launcher icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp admin-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug
        if: ${{ inputs.variant == 'debug' }}
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk maraei-debug.apk
      - name: Build release (signed)
        if: ${{ inputs.variant == 'release' }}
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Secrets التوقيع غير موجودة"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          gradle assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk maraei-release.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: maraei-apk-${{ inputs.variant }}
          path: android/maraei-*.apk
      - name: Publish release
        if: ${{ inputs.variant == 'release' && inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Maraei APK ${{ github.run_number }}
          files: android/maraei-release.apk
